[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",  # ruff
  "ASYNC",
  "D",    # docstrings
]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names.
"tests/*" = ["D100", "D101", "D102", "D103", "D107"]
# User-facing typography and long lines in the page markup.
"airplay-relay/airplay_relay/page.py" = ["RUF001", "E501"]
# Listing a small tmpfs directory blocks for microseconds.
"airplay-relay/airplay_relay/status.py" = ["ASYNC240"]
# Reads three small segments once, at startup.
"airplay-relay/airplay_relay/standby.py" = ["ASYNC240"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["airplay_relay", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["airplay-relay"]
